name: ✦ IDEOANS Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Ensure concurrent runs on the same branch are cancelled to optimize build queue usage
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🚀 Compile, Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: ⚙️ Restore Next.js & Node Compiler Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Unique cache key based on lock file hash and source code hashes
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 🔍 Linter Code Quality Validation
        run: npm run lint
        continue-on-error: false

      - name: 🛡️ TypeScript Compiler Type-Safety Check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: 🏗️ Production Bundle Compilation
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Pass secrets down if dynamic route pre-rendering requires keys
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
